<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
<title>Cruise Hub · Guida offline</title>
<style>
:root{--navy:#0a344b;--sea:#0c7190;--muted:#667b8b;--line:#d9e5eb;--bg:#f3f7f9}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:#173247;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:linear-gradient(135deg,#07334b,#138297);color:#fff;padding:20px 16px}
main{max-width:760px;margin:auto;padding:14px 16px 95px}
h1{font-size:24px;margin:7px 0}h2{font-size:21px;margin:12px 0}h3{font-size:16px}
p{line-height:1.55}.small{font-size:12px;color:var(--muted);line-height:1.5}
header .small{color:#e6f1f5}
nav{display:flex;position:fixed;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom);background:#fff;box-shadow:0 -4px 20px #082d4818;z-index:5}
nav button{flex:1;border:0;background:white;padding:13px 5px;color:#36596b;font-size:12px;font-weight:700}
nav button.on{border-top:3px solid #1195a9;color:#065375}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);padding:15px;margin:12px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{border:1px solid #c3d8e2;background:#eaf4f7;color:#095676;padding:10px 14px;border-radius:10px;font-weight:650;cursor:pointer}
.linkcard{width:100%;text-align:left;display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin:10px 0;cursor:pointer;color:inherit}
.linkcard strong{font-size:17px}.pill{border-radius:25px;background:#e6f5f0;color:#276846;padding:3px 9px;font-size:11px;font-weight:700}
.guide{padding:0;overflow:hidden}.guide summary{cursor:pointer;padding:15px;font-weight:700}.guide .content{padding:0 15px 16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{border:1px solid var(--line);padding:9px 11px;border-radius:24px;background:white;color:#234f66;cursor:pointer}.actions button.on{background:#0b6789;color:white}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.task input{width:19px;height:19px}
input[type=search]{width:100%;font:inherit;padding:12px;border:1px solid #c8dbe4;border-radius:11px}
.notice{border-left:3px solid #b48319;background:#fcf6e5;padding:12px 15px;margin:12px 0;border-radius:7px;line-height:1.5}
.tl{margin:16px 0}
.tl-row{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;position:relative;padding-bottom:16px}
.tl-row:not(:last-child)::before{content:"";position:absolute;left:81px;top:18px;bottom:0;border-left:2px solid #c8dce3}
.tl-time{font-size:12px;color:#0c6685;font-weight:750;padding-top:3px;line-height:1.3;overflow-wrap:anywhere}
.tl-in{position:relative;padding-left:12px;min-width:0}
.tl-in::before{content:"";position:absolute;left:-3px;top:6px;width:10px;height:10px;background:#0b7e9d;border-radius:50%;border:2px solid white;box-shadow:0 0 0 2px #bfdce4}
.tl-box{background:white;border:1px solid #d9e5eb;border-radius:13px;padding:12px}
.tl-box h3{margin:0 0 6px;font-size:15px}.tl-box p{font-size:13px;margin:0 0 8px;line-height:1.4}
.tl-link{display:inline-flex;padding:8px 10px;background:#e9f4f7;color:#0b5c7b;border:1px solid #ccdde5;border-radius:8px;text-decoration:none;font-weight:680;font-size:12px;margin:3px 5px 3px 0}
.tl-link.book{background:#0b6d8a;color:white;border-color:#0b6d8a}
.tl-box details{border-top:1px solid #e4ecf0;margin-top:8px;padding-top:7px}
.tl-box summary{font-size:12px;color:#0c6486;font-weight:650;cursor:pointer}
.tl-box .more{padding-top:7px;font-size:13px;line-height:1.5}
.tl-return .tl-box{background:#e9f7f1;border-color:#bedbce}
.tl-choices{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.tl-choices button{background:white;border:1px solid #cadde5;border-radius:22px;padding:9px 12px;font-size:13px;color:#31556b;font-weight:750}
.tl-choices button.on{background:#0b6386;color:white;border-color:#0b6386}
@media(max-width:390px){.tl-row{grid-template-columns:65px minmax(0,1fr);gap:7px}.tl-row:not(:last-child)::before{left:68px}}
.deckbutton{width:100%;text-align:left;border:0;background:#fff;padding:13px 7px;border-bottom:1px solid var(--line);color:var(--ink)}
.deckbutton strong{font-size:15px}.deckbutton:last-child{border-bottom:0}
.placeinfo{line-height:1.55}.callout{background:#e9f5f8;border-radius:11px;padding:14px;margin:12px 0}
.route-step{display:grid;grid-template-columns:86px 1fr;gap:10px;position:relative;margin-bottom:15px}
.route-step:not(:last-child)::before{content:"";position:absolute;left:92px;top:25px;bottom:-12px;border-left:2px solid #bed8df}
.route-step .time{font-size:12px;color:#0c6586;font-weight:750;overflow-wrap:anywhere}
.route-step .info{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff}
.route-step .info p{margin:7px 0;font-size:13px}
.route-step .info strong{font-size:15px}
@media(max-width:390px){.route-step{grid-template-columns:64px 1fr;gap:9px}.route-step:not(:last-child)::before{left:69px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div style="font-size:12px;font-weight:750;letter-spacing:2px">🚢 CRUISE HUB · OFFLINE</div><h1>MSC World Europa</h1><div>25 ottobre – 1 novembre 2026</div><p class="small" id="exported"></p></header>
<main id="main" aria-live="polite"></main>
<nav aria-label="Guida offline">
<button data-page="tappe" class="on">🗺️<div>Tappe</div></button>
<button data-page="nave">🚢<div>A bordo</div></button>
<button data-page="checklist">✅<div>Checklist</div></button>
<button data-page="note">📝<div>Note</div></button>
</nav>
<script>
(function(){
"use strict";
var DATA=/*__CRUISE_SNAPSHOT__*/null;
var page="tappe",chosen="",ship="mappa",checked=(DATA&&DATA.checked||[]).slice(),routeChoice={},deck="",place="",trip="",placeSource="mappa";
var search="";
var root=document.getElementById("main");
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(x){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&quot;"}[x]})}
function dayLabel(date){var p=(DATA.ports||[]).find(function(x){return x[0]===date});return p?(p[1]+" · "+p[2]):date}
function primary(date){return (DATA.updates||[]).find(function(u){return u.port_date===date&&u.category==="escursione"&&/^escursione-proposta-/.test(u.slug||"")})}
function isTimeline(u){return /^timeline-20[0-9]{2}-[0-9]{2}-[0-9]{2}$/.test(String(u&&u.slug||""))}
function portTimeline(date){
 var row=(DATA.updates||[]).find(function(x){return x.slug==="timeline-"+date});
 if(!row)return null;
 try{var obj=JSON.parse(row.body);return obj&&obj.v===1&&Array.isArray(obj.routes)?obj:null}catch(e){return null}
}
function safeHref(url){return typeof url==="string"&&/^https:\/\/[^\s"'<>]+$/i.test(url)}
function timelineHtml(date,timeline){
 var routes=timeline.routes||[],route=routes.find(function(r){return r.id===routeChoice[date]})||routes[0];
 if(!route)return '';
 var result='<div class="card"><strong>Il programma in breve</strong><p>'+esc(timeline.summary||"")+'</p></div>';
 if(routes.length>1){
  result+='<h3>Quale percorso?</h3><div class="tl-choices">';
  routes.forEach(function(r){result+='<button data-route="'+esc(r.id)+'" class="'+(route===r?'on':'')+'">'+esc(r.label)+'</button>'});
  result+='</div>';
  if(route.description)result+='<p class="small">'+esc(route.description)+'</p>';
 }
 result+='<div class="tl">';
 (route.steps||[]).forEach(function(step){
  result+='<div class="tl-row'+(step.flag==="return"?' tl-return':'')+'"><div class="tl-time">'+esc(step.time||"")+'</div><div class="tl-in"><div class="tl-box"><h3>'+esc(step.title||"")+'</h3><p>'+esc(step.short||"")+'</p>';
  (step.links||[]).filter(function(a){return a&&safeHref(a.url)}).forEach(function(a){result+='<a class="tl-link'+(a.kind==="booking"?' book':'')+'" href="'+esc(a.url)+'" target="_blank" rel="noopener noreferrer">'+esc(a.label||"Sito")+' ↗</a>'});
  if(step.map)result+='<a class="tl-link" href="https://www.google.com/maps/search/?api=1&amp;query='+encodeURIComponent(step.map)+'" target="_blank" rel="noopener noreferrer">📍 Mappa ↗</a>';
  if(step.detail)result+='<details><summary>Info utili</summary><div class="more">'+esc(step.detail)+'</div></details>';
  result+='</div></div></div>';
 });
 result+='</div>';
 if(timeline.warning)result+='<div class="notice"><strong>Da ricordare</strong><div>'+esc(timeline.warning)+'</div></div>';
 return result;
}
function noteDetails(u){
 var body=String(u.body||"").trim(),parts=body.split(/\n\s*\n/g).filter(Boolean);
 if(parts.length===1&&body.length>1000){parts=body.split(/\n(?=[A-ZÀ-Ù][A-ZÀ-Ù 0-9()\/-]{4,65}:)/).filter(Boolean)}
 if(parts.length<2)return '<div class="card"><h3>'+esc(u.title)+'</h3><p style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(body)+'</p></div>';
 return '<div class="card"><strong>'+esc(u.title)+'</strong><p class="small">Tocca una sezione per aprirla.</p></div>'+parts.map(function(t,i){
 var head=t.split(/\n/)[0].trim(),m=head.match(/^([^:.]{4,75})(?:[:.]|\s[—–]\s)/);
 var label=m?m[1]:(i===0?"Panoramica":"Dettagli "+i);
 return '<details class="card guide"'+(i===0?' open':'')+'><summary>'+esc(label)+'</summary><div class="content">'+esc(t)+'</div></details>'
 }).join("");
}
function offlineDirectory(){
 var out={venues:[],general:[],experiences:[],hours:[],hoursGeneral:[]};
 (DATA.updates||[]).filter(function(x){return /^onboard-dir-/.test(x.slug||"")}).forEach(function(row){
  try{
   var item=JSON.parse(row.body);if(!item||item.v!==1)return;
   if(item.type==="policies")out.general=out.general.concat(item.general||[]);
   if(item.type==="venues")out.venues=out.venues.concat((item.items||[]).map(function(v){return {id:v[0],name:v[1],deck:v[2],price:v[3],short:v[4]}}));
   if(item.type==="experiences")out.experiences=out.experiences.concat(item.items||[]);
   if(item.type==="hours"){out.hours=out.hours.concat(item.items||[]);out.hoursGeneral=out.hoursGeneral.concat(item.general||[])}
  }catch(e){}
 });
 return out;
}
function offlineHours(v){
 var result='<div class="card"><h3>'+esc(v.name)+'</h3><p class="small">Ponte '+esc(v.deck)+' · ORARI INDICATIVI, DA VERIFICARE A BORDO</p>';
 (v.schedule||[]).forEach(function(p){result+='<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>'+esc(p[0])+'</span><strong>'+esc(p[1])+'</strong></div>'});
 if(v.note)result+='<p class="small">'+esc(v.note)+'</p>';
 result+='</div>';return result;
}
function venueFor(id){return offlineDirectory().venues.find(function(v){return v.id===id})}
function offlineCabin(){return (DATA.updates||[]).find(function(v){return v.slug==="cabina-msc-world-europa-2026"})}
function locationCard(v){
 if(!v)return '<div class="card">Luogo non trovato nella guida offline.</div>';
 var out='<div class="card"><div class="row"><h2>'+esc(v.name)+'</h2><span class="pill">Ponte '+esc(v.deck)+'</span></div><p class="small">'+esc(v.price)+'</p><p>'+esc(v.short)+'</p></div>';
 if(v.id==="cabine"&&offlineCabin())out+='<div class="card"><h3>La vostra cabina</h3><p>'+esc(offlineCabin().body)+'</p></div>';
 var h=offlineDirectory().hours.find(function(x){return x.id===v.id});if(h)out+='<h3>Orari del locale</h3>'+offlineHours(h);
 if(v.id==="pescaderia")out+='<div class="callout">Consiglio: chiedi il cuoppo al Grab & Go per gustarlo durante la passeggiata sulla World Promenade. Servizio extra.</div>';
 out+='<div class="notice">Per orari e prezzi effettivi consulta MSC for Me. I link esterni richiedono una connessione.</div>';
 return out;
}
function experienceCard(x){
 var out='<div class="card"><h2>'+esc(x.title)+'</h2><p>'+esc(x.summary)+'</p><div class="small">'+esc(x.duration)+'</div></div>';
 (x.steps||[]).forEach(function(step){out+='<div class="route-step"><div class="time">'+esc(step[0])+'</div><div class="info"><strong>'+esc(step[1])+'</strong><p>'+esc(step[2])+'</p>'+(venueFor(step[3])?'<button class="btn" data-place="'+esc(step[3])+'">Scheda del luogo ›</button>':'')+'</div></div>'});
 if(x.warning)out+='<div class="notice">'+esc(x.warning)+'</div>';
 return out;
}
function shipKind(u,k){
 var slug=String(u.slug||"");
 if(k==="piscine")return u.category==="attivita"&&/piscine|aquapark/.test(slug);
 if(k==="sport")return u.category==="attivita"&&/^msc-world-europa-sport-/.test(slug);
 if(k==="spettacoli")return u.category==="attivita"&&/teatro|spettacoli|serate|panorama|giornata-navigazione/.test(slug);
 if(k==="bambini")return /doremiland|mini-club|lego|genitori-restrizioni|halloween/.test(slug);
 if(k==="ristorazione")return u.category==="ristorazione";
 return false;
}
function render(){
 if(!DATA){root.innerHTML='<div class="card"><h2>Guida non personalizzata</h2><p>Questa è la struttura del file offline. Apri Cruise Hub con Internet, accedi e scegli “Scarica guida offline” per ottenere la copia completa dei tuoi itinerari e consigli.</p></div>';return}
 document.getElementById("exported").textContent="Copia esportata: "+(DATA.exported_at||"")+". Nessuna connessione Internet richiesta.";
 document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.page===page||page==="detail"&&b.dataset.page==="tappe")});
 var out="";
 if(page==="tappe"){
  out='<h2>Itinerario</h2><p class="small">Seleziona uno scalo per vedere il suo programma completo, separato dagli altri giorni.</p>';
  (DATA.ports||[]).forEach(function(p){
   var u=primary(p[0]),count=(DATA.updates||[]).filter(function(x){return x.port_date===p[0]&&!isTimeline(x)}).length;
   out+='<button class="linkcard" data-open="'+esc(p[0])+'"><div class="row"><strong>'+esc(p[1])+' · '+esc(p[2])+'</strong><span class="small">'+esc(p[3])+' → '+esc(p[4])+'</span></div><p>'+esc(p[5])+'</p><div class="row"><span class="small">'+(u?"Itinerario dettagliato disponibile":count+" note del giorno")+'</span><span class="pill">Apri dettagli ›</span></div></button>';
  });
  var experiences=offlineDirectory().experiences;
  if(experiences.length){
   out+='<h2>✨ Esperienze sulla nave</h2><p class="small">Percorsi facoltativi e flessibili anche senza Internet.</p>';
   experiences.forEach(function(x){out+='<button class="linkcard" data-trip-from-tappe="'+esc(x.id)+'"><strong>'+esc(x.title)+'</strong><p>'+esc(x.summary)+'</p><span class="small">'+esc(x.duration)+' · Apri percorso ›</span></button>'});
  }
 }else if(page==="detail"){
  var p=(DATA.ports||[]).find(function(x){return x[0]===chosen});
  if(!p){page="tappe";render();return}
  var u=primary(chosen),timeline=portTimeline(chosen);
  out='<button class="btn" data-back="1">← Tutte le tappe</button><h2>'+esc(p[1])+' · '+esc(p[2])+'</h2><div class="card"><div class="row"><strong>Scalo</strong><span>'+esc(p[3])+' → '+esc(p[4])+'</span></div><p class="small">Per il rientro prevale sempre l’ultimo imbarco comunicato da MSC.</p></div>';
  if(timeline)out+=timelineHtml(chosen,timeline);
  else out+='<div class="card">Timeline non inclusa in questa copia. Consulta gli appunti originali qui sotto.</div>';
  if(u)out+='<details class="card guide"><summary>Appunti originali e fonti</summary><div class="content">'+esc(u.body)+'</div></details>';
  var others=(DATA.updates||[]).filter(function(x){return x.port_date===chosen&&x!==u&&!isTimeline(x)});
  if(others.length){out+='<details class="card guide"><summary>Altri consigli del giorno ('+others.length+')</summary><div class="content">'+others.map(function(x){return '<details class="card guide"><summary>'+esc(x.title)+'</summary><div class="content">'+esc(x.body)+'</div></details>'}).join('')+'</div></details>'}
 }else if(page==="nave"){
  var guide=offlineDirectory();
  out='<h2>A bordo</h2><div class="actions">'+[["mappa","🧭 Mappa"],["percorsi","✨ Percorsi"],["consigli","💡 Consigli"],["orari","🕒 Orari"],["piscine","Piscine"],["sport","Sport"],["spettacoli","Spettacoli"],["bambini","Bambini"],["ristorazione","Ristorazione"]].map(function(p){return '<button data-ship="'+p[0]+'" class="'+(ship===p[0]?"on":"")+'">'+p[1]+'</button>'}).join("")+'</div>';
 if(ship==="mappa"){
  if(place){
   out+='<button class="btn" id="backPlace">← '+(placeSource==="percorsi"?"Ritorna al percorso":"Ritorna al ponte")+'</button>'+locationCard(venueFor(place));
  }else if(deck){
   var dest=guide.venues.filter(function(v){return v.deck.split(/[^0-9]+/).includes(deck)});
   out+='<button class="btn" id="backDeck">← Tutti i ponti</button><h2>Ponte '+esc(deck)+'</h2><div class="card"><h3>Luoghi su questo ponte</h3>'+dest.map(function(v){return '<button class="deckbutton" data-place="'+esc(v.id)+'"><strong>'+esc(v.name)+'</strong><span style="float:right">Info ›</span></button>'}).join('')+'</div>';
  }else{
   out+='<p class="small">Apri un ponte, poi tocca il luogo per i consigli.</p>';
   var decks=["5","6","7","8","10","18","19","20"];
   decks.forEach(function(n){var count=guide.venues.filter(function(v){return v.deck.split(/[^0-9]+/).includes(n)}).length;out+='<button class="linkcard" data-deck="'+n+'"><div class="row"><strong>Ponte '+n+'</strong><span class="pill">Esplora ›</span></div><p class="small">'+count+' luoghi in guida</p></button>'});
  }
 }else if(ship==="percorsi"){
  if(trip){
   var current=guide.experiences.find(function(x){return x.id===trip});
   out+='<button class="btn" id="backTrip">← Tutti i percorsi</button>'+(current?experienceCard(current):'<div class="card">Percorso non trovato.</div>');
  }else{
   out+='<h2>Esperienze a bordo</h2>';guide.experiences.forEach(function(x){out+='<button class="linkcard" data-trip="'+esc(x.id)+'"><strong>'+esc(x.title)+'</strong><p>'+esc(x.summary)+'</p><span class="small">'+esc(x.duration)+' · Apri ›</span></button>'});
  }
 }else if(ship==="orari"){
  out+='<h2>Orari pasti a bordo</h2><div class="notice"><strong>Non confermati per questa crociera:</strong> consulta MSC for Me e la Cruise Card per gli orari reali.</div>';
  guide.hoursGeneral.forEach(function(x){out+='<details class="card guide"><summary>'+esc(x[0])+'</summary><div class="content">'+esc(x[1])+'</div></details>'});
  guide.hours.forEach(function(x){out+=offlineHours(x)});
 }else if(ship==="consigli"){
  out+='<h2>Consigli utili</h2>';guide.general.forEach(function(x){out+='<details class="card guide"><summary>'+esc(x[0])+'</summary><div class="content">'+esc(x[1])+'</div></details>'});
 }else{
  var set=(DATA.updates||[]).filter(function(u){return shipKind(u,ship)}),q=search.trim().toLowerCase();
  out+='<p class="small">'+set.length+' approfondimenti disponibili.</p><input id="q" type="search" placeholder="Cerca nei consigli..." value="'+esc(search)+'">';
  set.filter(function(u){return !q||(u.title+" "+u.body).toLowerCase().includes(q)}).forEach(function(u){out+='<details class="card guide"><summary>'+esc(u.title)+'</summary><div class="content">'+esc(u.body)+'</div></details>'});
  if(ship==="ristorazione"){out+='<h3>Ristoranti e bar</h3>';guide.venues.filter(function(v){return /Buffet|Bar|Ristorante|Coffee|Pescaderia|Tacos|Gelat|Pub|caffetteria|Caffetteria/i.test(v.name+" "+v.short)}).forEach(function(v){out+='<button class="linkcard" data-place="'+esc(v.id)+'"><strong>'+esc(v.name)+'</strong><p class="small">Ponte '+esc(v.deck)+' · '+esc(v.price)+'</p><p>'+esc(v.short)+'</p></button>'})}
 }
 }else if(page==="checklist"){
  out='<h2>Checklist</h2><div class="notice">Le spunte in questo file non si sincronizzano con il Cruise Hub online. Il file contiene lo stato al momento dell’esportazione.</div>';
  ["pre","board","food","ports"].forEach(function(k){
   var names={pre:"Prima della partenza",board:"Appena a bordo",food:"Ristorazione",ports:"Prima delle escursioni"},rows=(DATA.checklist||{})[k]||[];
   if(!rows.length)return;
   out+='<div class="card"><h3>'+names[k]+'</h3>'+rows.map(function(x){return '<label class="task"><input type="checkbox" data-check="'+esc(x.id)+'" '+(checked.includes(x.id)?"checked":"")+'><span>'+esc(x.text)+'</span></label>'}).join("")+'</div>';
  })
 }else if(page==="note"){
  out='<h2>Note personali</h2><div class="notice">Le note sono una fotografia al momento del download. Evita di condividere il file, perché può contenere dettagli privati.</div>';
  var rows=DATA.personal_notes||[];
  if(!rows.length)out+='<div class="card">Non ci sono note personali salvate.</div>';
  rows.forEach(function(n){out+='<details class="card guide"><summary>'+esc(n.title||"Nota")+'</summary><div class="content">'+esc(n.body)+'</div></details>'});
 }
 root.innerHTML=out;
 root.querySelectorAll("[data-open]").forEach(function(b){b.onclick=function(){chosen=b.dataset.open;page="detail";render();window.scrollTo(0,0)}});
 root.querySelectorAll("[data-back]").forEach(function(b){b.onclick=function(){page="tappe";render();window.scrollTo(0,0)}});
 root.querySelectorAll("[data-route]").forEach(function(b){b.onclick=function(){routeChoice[chosen]=b.dataset.route;render()}});
 root.querySelectorAll("[data-ship]").forEach(function(b){b.onclick=function(){ship=b.dataset.ship;search="";deck="";place="";trip="";render()}});
 root.querySelectorAll("[data-deck]").forEach(function(b){b.onclick=function(){deck=b.dataset.deck;place="";render();window.scrollTo(0,0)}});
 root.querySelectorAll("[data-place]").forEach(function(b){b.onclick=function(){placeSource=ship==="percorsi"?"percorsi":"mappa";place=b.dataset.place;ship="mappa";render();window.scrollTo(0,0)}});
 root.querySelectorAll("[data-trip]").forEach(function(b){b.onclick=function(){trip=b.dataset.trip;render();window.scrollTo(0,0)}});
 root.querySelectorAll("[data-trip-from-tappe]").forEach(function(b){b.onclick=function(){trip=b.dataset.tripFromTappe;ship="percorsi";page="nave";render();window.scrollTo(0,0)}});
 var backPlace=document.getElementById("backPlace");if(backPlace)backPlace.onclick=function(){place="";if(placeSource==="percorsi")ship="percorsi";render();window.scrollTo(0,0)};
 var backDeck=document.getElementById("backDeck");if(backDeck)backDeck.onclick=function(){deck="";render();window.scrollTo(0,0)};
 var backTrip=document.getElementById("backTrip");if(backTrip)backTrip.onclick=function(){trip="";render();window.scrollTo(0,0)};
 root.querySelectorAll("[data-check]").forEach(function(x){x.onchange=function(){checked=x.checked?checked.concat([x.dataset.check]):checked.filter(function(k){return k!==x.dataset.check})}});
 var qbox=document.getElementById("q");if(qbox){qbox.onchange=function(){search=qbox.value;render()};qbox.onkeydown=function(e){if(e.key==="Enter"){search=qbox.value;render()}}}
}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){page=b.dataset.page;render();window.scrollTo(0,0)}});
render();
})();
</script>
</body></html>
