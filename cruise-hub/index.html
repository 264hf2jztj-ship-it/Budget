 else if(x.type==="cruise-hub-update"&&x.v===1){
 (x.notes||[]).forEach(function(n){if(n&&typeof n.body==="string")st.notes.push({id:String(n.id||"new:"+Date.now()+Math.random()),title:String(n.title||"Nota").slice(0,100),body:n.body.slice(0,5000),updated:new Date().toISOString()})});
 (x.tasks||[]).forEach(function(t){if(t&&groups[t.group]&&typeof t.text==="string")st.customTasks.push({group:t.group,text:t.text.slice(0,200)})});
 (x.items||[]).forEach(function(t){if(t&&["food","bar"].includes(t.cat)&&typeof t.title==="string")st.customItems.push({cat:t.cat,title:t.title.slice(0,120),desc:String(t.desc||"").slice(0,300),deck:String(t.deck||"?"),price:t.price==="incluso"?"incluso":"extra"})});
 }else throw Error("Formato non riconosciuto");
 save();alert("Importazione completata");
 }catch(e){alert("Errore di importazione: "+e.message)}
 }
}

function authError(err) {
 var msg = String(err&&err.message||err||"Errore sconosciuto");
 var code = err&&err.code?" · "+err.code:"";
 var stat = err&&err.status?" (HTTP "+err.status+")":"";
 ref("loginmsg").textContent="Accesso non riuscito: "+msg+code+stat+". Se non riconosci questo errore, copia il messaggio e riportalo nella chat, senza condividere password o codici.";
}
ref("login").onsubmit=async function(e){e.preventDefault();if(!db){ref("loginmsg").textContent="Connessione non inizializzata: ricarica Safari.";return}
 var email=ref("email").value.trim();ref("loginmsg").textContent="Invio link...";
 try {
  var r=await db.auth.signInWithOtp({email:email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}});
  if(r.error)authError(r.error);else ref("loginmsg").textContent="Controlla l'email di Cucina Hub e apri il link su questo dispositivo.";
 }catch(err){authError(err)}
};
ref("passwordLogin").onclick=async function(){
 if(!db){ref("loginmsg").textContent="Connessione non inizializzata: ricarica Safari.";return}
 var email=ref("email").value.trim(),password=ref("password").value;
 if(!email||!password){ref("loginmsg").textContent="Inserisci l’email di Cucina Hub e la password.";return}
 ref("loginmsg").textContent="Verifica credenziali...";
 try {var r=await db.auth.signInWithPassword({email:email,password:password});if(r.error)authError(r.error);else ref("loginmsg").textContent="Accesso riuscito."}
 catch(err){authError(err)}
};
async function start(){
 if(!window.supabase||!window.supabase.createClient){ref("loginmsg").textContent="Impossibile caricare la libreria Supabase. Prova a ricaricare la pagina in Safari o disattiva temporaneamente i blocchi dei contenuti per questa pagina.";return}
 db=window.supabase.createClient(CONFIG.url,CONFIG.key,{auth:{flowType:"pkce",detectSessionInUrl:true,autoRefreshToken:true,persistSession:true}});
 db.auth.onAuthStateChange(function(event,session){if(event==="SIGNED_OUT"){stop();return}if(session&&session.user&&(event==="SIGNED_IN"||event==="INITIAL_SESSION"))setTimeout(function(){initUser(session.user)},0)});
 var r=await db.auth.getSession();if(r.data&&r.data.session&&r.data.session.user)await initUser(r.data.session.user);
 document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&actor){if(pending)flush();else load();loadChatUpdates();loadChecklistItems()}});
 window.addEventListener("online",function(){if(actor){if(pending)flush();loadChatUpdates();loadChecklistItems()}});
 setInterval(function(){if(actor&&document.visibilityState==="visible"){if(pending)flush();else load();loadChatUpdates();loadChecklistItems()}},60000);
}
start();
})();</script></body></html>
