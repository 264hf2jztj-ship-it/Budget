// Pulizia importo: gestisce formato italiano "1.234,56", parentesi, segno, valuta
function cleanNum(s) {
  if (s == null) return 0;
  let t = String(s).trim();
  if (!t) return 0;
  const neg = t.includes("(") || t.trim().startsWith("-");
  t = t.replace(/[()€$\s]/g, "").replace(/[A-Za-z]/g, "");
  if (t.includes(",") && t.includes(".")) t = t.replace(/\./g, "").replace(",", ".");
  else if (t.includes(",")) t = t.replace(",", ".");
  t = t.replace(/[^0-9.\-]/g, "");
  let v = parseFloat(t);
  if (isNaN(v)) v = 0;
  v = Math.abs(v);
  return neg ? -v : v;
}

function isInternal(desc) {
  const d = (desc || "").toLowerCase();
  return INTERNAL.some((k) => d.includes(k));
}
function classify(desc) {
  const d = (desc || "").toLowerCase();
  for (const [cat, keys] of RULES) if (keys.some((k) => d.includes(k))) return cat;
  return "Altro";
}

function detectSource(headers) {
  const h = headers.map((x) => String(x).toLowerCase().trim());
  const has = (k) => h.includes(k);
  if (has("transaction_id") && has("asset_class")) return "tr";
  if (has("amount") && has("type") && has("description") && (has("balance") || has("product") || has("started date") || has("completed date")))
    return "revolut";
  return "generic";
}

// Normalizza le righe in {desc, amount} (amount negativo = uscita)
function normalize(source, rows) {
  if (source === "tr") {
    return rows
      .filter((r) => (r.type || "") === "CARD_TRANSACTION")
      .map((r) => ({ desc: r.name || r.description || "", amount: cleanNum(r.amount) }));
  }
  if (source === "revolut") {
    return rows
      .filter((r) => !r.State || String(r.State).toUpperCase() === "COMPLETED")
      .map((r) => ({ desc: r.Description || "", amount: cleanNum(r.Amount) }));
  }
  return [];
}

function aggregate(norm) {
  const totals = {};
  let excluded = 0, count = 0;
  const altro = [];
  for (const { desc, amount } of norm) {
    if (!amount) { excluded++; continue; }
    if (isInternal(desc)) { excluded++; continue; }
    const cat = classify(desc);
    totals[cat] = (totals[cat] || 0) + -amount; // uscita(neg)->+spesa ; entrata(pos)->rimborso(-)
    count++;
    if (cat === "Altro") altro.push({ desc, amount });
  }
  for (const k of Object.keys(totals)) totals[k] = Math.round(totals[k] * 100) / 100;
  return { totals, excluded, count, altro };
}

function guessMapping(headers) {
  const find = (re) => headers.find((x) => re.test(String(x))) || "";
  const dateCol = find(/data|date/i);
  const descCol = find(/descriz|causale|dettagli|operazione|description|movimento/i);
  const outCol = find(/uscit|dare|addebit|debit/i);
  const inCol = find(/entrat|avere|accredit|credit/i);
  const amtCol = find(/importo|amount|saldo movimento/i);
  const amtMode = outCol && inCol ? "split" : "single";
  return { dateCol, descCol, amtCol: amtCol || outCol || "", outCol, inCol, amtMode };
}

function aggregateGeneric(rows, m) {
  const norm = rows.map((r) => {
    const desc = r[m.descCol] || "";
    let amount;
    if (m.amtMode === "split") {
      const out = Math.abs(cleanNum(r[m.outCol]));
      const inn = Math.abs(cleanNum(r[m.inCol]));
      amount = inn - out;
    } else {
      amount = cleanNum(r[m.amtCol]);
    }
    return { desc, amount };
  });
  return aggregate(norm);
}

const MESI_LC = MESI.map((m) => m.toLowerCase());

function parseHistoryCSV(rowsArr) {
  const expenses = [];
  const monthData = {}; // monthIndex -> array valori per colonna anno
  let maxCols = 0;
  for (const cells of rowsArr) {
    if (!cells || cells.length < 2) continue;
    const name = (cells[0] || "").toString().trim();
    const amountRaw = cells[1] != null ? String(cells[1]).trim() : "";
    const month = (cells[3] || "").toString().trim().toLowerCase();
    const monthIdx = MESI_LC.indexOf(month);
    if (name) expenses.push({ name, amount: amountRaw });
    if (monthIdx >= 0) {
      const vals = cells.slice(4).map((v) => (v == null ? "" : String(v).trim()));
      monthData[monthIdx] = vals;
      maxCols = Math.max(maxCols, vals.length);
    }
  }
  const monthIdxs = Object.keys(monthData);
  if (monthIdxs.length === 0 || maxCols === 0) return { expenses, years: [], yearLabels: [] };
  const nowY = new Date().getFullYear();
  const yearLabels = Array.from({ length: maxCols }, (_, i) => String(nowY - maxCols + 1 + i));
  const years = yearLabels.map((label, j) => ({
    label,
    months: MESI.map((_, mi) => {
      const vals = monthData[mi];
      const v = vals && vals[j];
      return v && v !== "" ? v : "";
    }),
  }));
  return { expenses, years, yearLabels };
}

    setLedger((ls) => [...ls, { id: uid(), label: "", webank: "", trIn: "", trOut: "", revolut: "" }]);
  const delLedgerRow = (id) => setLedger((ls) => ls.filter((r) => r.id !== id));

  // ---- Analisi mensile ----
  const analysisTotal = (a) => a.rows.reduce((s, r) => s + (parse(r.amount) || 0), 0);
  const trend = useMemo(() => analyses.map((a) => ({ id: a.id, label: a.label, total: analysisTotal(a) })), [analyses]);
  const trendMax = Math.max(1, ...trend.map((t) => t.total));
  const current = analyses.find((a) => a.id === selAnalysis) || analyses[0];
  const curTotal = current ? analysisTotal(current) : 0;
  const curRows = current
    ? current.rows
        .map((r) => ({ ...r, val: parse(r.amount) || 0 }))
        .sort((a, b) => b.val - a.val)
    : [];

  const addAnalysis = () => {
    const a = { id: uid(), label: "", rows: CATEGORIE.slice(0, 8).map((cat) => ({ id: uid(), cat, amount: "" })) };
    setAnalyses((as) => [a, ...as]);
    setSelAnalysis(a.id);
  };
  const delAnalysis = (id) =>
    setAnalyses((as) => {
      const nn = as.filter((a) => a.id !== id);
      if (id === selAnalysis && nn.length) setSelAnalysis(nn[0].id);
      return nn;
    });
  const setAnalysisLabel = (id, label) =>
    setAnalyses((as) => as.map((a) => (a.id === id ? { ...a, label } : a)));
  const setRow = (aid, rid, field, val) =>
    setAnalyses((as) => as.map((a) => (a.id === aid ? { ...a, rows: a.rows.map((r) => (r.id === rid ? { ...r, [field]: val } : r)) } : a)));
  const addRow = (aid) =>
    setAnalyses((as) => as.map((a) => (a.id === aid ? { ...a, rows: [...a.rows, { id: uid(), cat: "Altro", amount: "" }] } : a)));
  const delRow = (aid, rid) =>
    setAnalyses((as) => as.map((a) => (a.id === aid ? { ...a, rows: a.rows.filter((r) => r.id !== rid) } : a)));

  // ---- Import CSV ----
  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setImpMsg("");
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const res = Papa.parse(String(reader.result), { header: true, skipEmptyLines: true });
        const headers = (res.meta && res.meta.fields) || [];
        const rows = res.data || [];
        const source = detectSource(headers);
        if (source === "tr" || source === "revolut") {
          const preview = aggregate(normalize(source, rows));
          setImp({ fileName: file.name, source, headers, rows, preview, needsMapping: false });
        } else {
          const mapping = guessMapping(headers);
          setImp({ fileName: file.name, source, headers, rows, mapping, preview: null, needsMapping: true });
        }
        setImpLabel(current ? current.label : meseAnnoCorrente());
        setImpTarget(current ? current.id : "new");
      } catch (err) {
        setImpMsg("Non sono riuscito a leggere il file. Assicurati che sia un CSV.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };
  const setMap = (field, val) => setImp((s) => ({ ...s, mapping: { ...s.mapping, [field]: val } }));
  const runGeneric = () => setImp((s) => ({ ...s, preview: aggregateGeneric(s.rows, s.mapping), needsMapping: false }));

  const confirmImport = () => {
    if (!imp || !imp.preview) return;
    const totals = imp.preview.totals;
    const addTo = (a) => {
      const rows = [...a.rows];
      for (const [cat, val] of Object.entries(totals)) {
        if (Math.abs(val) < 0.005) continue;
        const existing = rows.find((r) => r.cat === cat);
        if (existing) {
          const nv = (parse(existing.amount) || 0) + val;
          existing.amount = String(Math.round(nv * 100) / 100).replace(".", ",");
        } else {
          rows.push({ id: uid(), cat, amount: String(val).replace(".", ",") });
        }
      }
      return { ...a, rows };
    };
    if (impTarget === "new") {
      const a = addTo({ id: uid(), label: impLabel || meseAnnoCorrente(), rows: [] });
      setAnalyses((as) => [a, ...as]);
      setSelAnalysis(a.id);
    } else {
      setAnalyses((as) => as.map((a) => (a.id === impTarget ? addTo(a) : a)));
      setSelAnalysis(impTarget);
    }
    setImpMsg(`${SOURCE_LABEL[imp.source]} importato: ${imp.preview.count} movimenti aggiunti.`);
    setImp(null);
  };

  // ---- Carica situazione: spese fisse + storico stipendi da CSV ----
  const onHistoryFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setHistMsg("");
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const text = String(reader.result);
        const rows = text.split(/\r?\n/).map((line) => line.split(";"));
        const parsed = parseHistoryCSV(rows);
        if (parsed.expenses.length === 0 && parsed.years.length === 0) {
          setHistMsg("Non ho riconosciuto righe valide in questo file. Il formato atteso è: Nome;Importo;;Mese;anno1;anno2;…");
          return;
        }
        setHist({ fileName: file.name, ...parsed });
      } catch (err) {
        setHistMsg("Non sono riuscito a leggere il file.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const confirmHistoryImport = () => {
    if (!hist) return;
    // spese fisse: aggiorna per nome, aggiunge se nuova, non tocca importo se il CSV lo lascia vuoto
    setExpenses((xs) => {
      const list = [...xs];
      for (const h of hist.expenses) {
        const nameKey = h.name.trim().toLowerCase();
        const existing = list.find((x) => x.name.trim().toLowerCase() === nameKey);
        if (existing) {
          if (h.amount !== "") existing.amount = h.amount;
        } else {
          list.push({ id: uid(), name: h.name, amount: h.amount });
        }
      }
      return list;
    });
    // stipendi: aggiorna/crea anni per etichetta, riempie solo i mesi presenti nel CSV
    let newCurrentId = null;
    const lastLabel = hist.years.length ? hist.years[hist.years.length - 1].label : null;
    setYears((ys) => {
      const list = ys.map((y) => ({ ...y, months: [...y.months] }));
      for (const hy of hist.years) {
        let target = list.find((y) => y.label === hy.label);
        if (!target) {
          target = { id: uid(), label: hy.label, months: MESI.map(() => "") };
          list.push(target);
        }
        hy.months.forEach((v, mi) => { if (v !== "") target.months[mi] = v; });
        if (hy.label === lastLabel) newCurrentId = target.id;
      }
      return list;
    });
    if (newCurrentId) setCurrentYearId(newCurrentId);
    setHistMsg(`Caricati ${hist.expenses.length} voci di spesa e ${hist.years.length} anni di stipendi.`);
    setHist(null);
  };

  const S = styles;

  return (
    <div style={S.page}>
      <style>{css}</style>

      <div style={S.wrap}>
        {/* Header */}
        <header style={S.header}>
          <div>
            <div style={S.kicker}>Bilancio familiare</div>
            <h1 style={S.h1}>Potere di spesa mensile</h1>
          </div>
          <div style={{ ...S.saveTag, opacity: saved ? 1 : 0 }}>
            <Check size={13} strokeWidth={3} /> Salvato
          </div>
        </header>

        {/* CARICA SITUAZIONE */}
        <section style={S.histPanel}>
          <div style={S.histHead}>
            <div>
              <div style={S.histTitle}>Carica situazione</div>
              <div style={S.histSub}>Spese fisse + storico stipendi da un CSV (es. esportato da Numbers/Excel)</div>
            </div>
            <label style={S.fileBtnGold}>
              <Upload size={14} /> CSV
              <input type="file" accept=".csv,text/csv" onChange={onHistoryFile} style={{ display: "none" }} />
            </label>
          </div>

          {histMsg && !hist && <div style={S.importOk}><Check size={13} strokeWidth={3} /> {histMsg}</div>}

          {hist && (
            <div style={S.previewBox}>
              <div style={S.previewTop}>
                <span style={S.previewSrc}>{hist.fileName}</span>
                <span style={S.previewMeta}>{hist.expenses.length} spese · {hist.years.length} anni</span>
              </div>
              <div style={S.previewList}>
                {hist.expenses.slice(0, 6).map((e, i) => (
                  <div key={i} style={S.previewRow}>
                    <span style={S.previewCat}>{e.name}</span>
                    <span style={S.previewVal}>{e.amount ? `€ ${e.amount}` : "–"}</span>
                  </div>
                ))}
                {hist.expenses.length > 6 && <div style={S.previewAltro}>+ altre {hist.expenses.length - 6} voci</div>}
              </div>
              {hist.years.length > 0 && (
                <div style={S.previewAltro}>
                  Anni: {hist.years.map((y) => y.label).join(", ")}
                </div>
              )}
              <div style={S.confirmRow}>
                <button style={S.confirmBtn} onClick={confirmHistoryImport}><Check size={15} /> Carica tutto</button>
                <button style={S.cancelBtn} onClick={() => setHist(null)}>Annulla</button>
              </div>
            </div>
          )}
        </section>

        {/* HERO */}
        <section style={S.hero}>
          <div style={S.heroLabel}>
            Ti resta ogni mese <span style={S.heroYear}>· anno {currentYear ? currentYear.label : "—"}</span>
          </div>
          <div style={{ ...S.heroNum, color: spesaCorrente >= 0 ? C.gold : C.neg }}>
            {spesaCorrente != null ? fmt0.format(spesaCorrente) : "—"}
          </div>
          <div style={S.heroSub}>
            <span>Media stipendio {currentAvg.avg != null ? fmt0.format(currentAvg.avg) : "—"}</span>
            <span style={S.heroMinus}>−</span>
            <span>Spese fisse {fmt0.format(fixedTotal)}</span>
            {currentAvg.count > 0 && (
              <span style={S.heroMesi}>· su {currentAvg.count} mes{currentAvg.count === 1 ? "e" : "i"}</span>
            )}
          </div>
        </section>

        {/* Confronto pluriennale */}
        <section className="cmp" style={S.compareRow}>
          <div style={S.compareCard}>
            <div style={S.compareTop}>Media pluriennale</div>
            <div style={S.compareBig}>{pluri.avg != null ? fmt0.format(pluri.avg) : "—"}</div>
            <div style={S.compareSmall}>
              {pluri.count > 0 ? `media di ${pluri.count} ann${pluri.count === 1 ? "o" : "i"} precedenti` : "nessun anno storico"}
            </div>
          </div>
          <div style={S.compareCard}>
            <div style={S.compareTop}>Potere di spesa storico</div>
            <div style={{ ...S.compareBig, color: spesaPluri != null && spesaPluri < 0 ? C.neg : C.ink }}>
              {spesaPluri != null ? fmt0.format(spesaPluri) : "—"}
            </div>
            <div style={S.compareSmall}>media storica − spese fisse</div>
          </div>
          <div style={S.compareCard}>
            <div style={S.compareTop}>Anno corrente vs storico</div>
            <div style={{ ...S.compareBig, color: delta == null ? C.ink : delta >= 0 ? C.pos : C.neg }}>
              {delta != null ? (delta >= 0 ? "+" : "") + fmt0.format(delta) : "—"}
            </div>
            <div style={S.compareSmall}>{delta == null ? "—" : delta >= 0 ? "quest'anno spendi di più" : "quest'anno più stretto"}</div>
          </div>
        </section>

        {/* SPESE FISSE */}
        <section style={S.block}>
          <div style={S.blockHead}>
            <div style={S.blockTitle}><Wallet size={16} color={C.gold} /> Spese fisse mensili</div>
            <div style={S.blockTotal}>{fmt2.format(fixedTotal)}<span style={S.perMonth}> /mese</span></div>
          </div>

          <div style={S.expList}>
            {expenses.map((e) => (
              <div key={e.id} style={S.expRow}>
                <input
                  style={S.expName}
                  value={e.name}
                  placeholder="Voce di spesa"
                  onChange={(ev) => setExp(e.id, "name", ev.target.value)}
                />
                <div style={S.expAmtWrap}>
                  <input
                    style={S.expAmt}
                    inputMode="decimal"
                    value={e.amount}
                    placeholder="0"
                    onChange={(ev) => setExp(e.id, "amount", ev.target.value)}
                  />
                  <span style={S.eur}>€</span>
                </div>
                <button style={S.iconBtn} onClick={() => delExp(e.id)} aria-label="Elimina voce">
                  <Trash2 size={15} />
                </button>
              </div>
            ))}
          </div>

          <button style={S.addBtn} onClick={addExp}><Plus size={15} /> Aggiungi spesa</button>
        </section>

        {/* STIPENDI */}
        <section style={S.block}>
          <div style={S.blockHead}>
            <div style={S.blockTitle}><CalendarDays size={16} color={C.gold} /> Stipendi per anno</div>
            <button style={S.addYearBtn} onClick={addYear}><Plus size={14} /> Anno</button>
          </div>
          <p style={S.hint}>Tocca il pallino sotto un anno per impostarlo come <b>anno corrente</b>. Le medie escludono i mesi vuoti.</p>

          <div style={S.tableScroll}>
            <table style={S.table}>
              <thead>
                <tr>
                  <th style={{ ...S.th, ...S.thSticky }}>Mese</th>
                  {years.map((y) => {
                    const isCur = y.id === currentYearId;
                    return (
                      <th key={y.id} style={{ ...S.th, ...(isCur ? S.thCurrent : {}) }}>
                        <input
                          style={{ ...S.yearInput, color: isCur ? C.gold : C.ink }}
                          value={y.label}
                          onChange={(ev) => setLabel(y.id, ev.target.value)}
                        />
                        <div style={S.yearCtrls}>
                          <button
                            onClick={() => setCurrentYearId(y.id)}
                            style={{ ...S.dot, ...(isCur ? S.dotOn : {}) }}
                            aria-label="Imposta come anno corrente"
                            title="Anno corrente"
                          />
                          <button style={S.yearDel} onClick={() => delYear(y.id)} aria-label="Elimina anno">
                            <Trash2 size={12} />
                          </button>
                        </div>
                      </th>
                    );
                  })}
                </tr>
              </thead>
              <tbody>
                {MESI.map((mese, mi) => (
                  <tr key={mese}>
                    <td style={{ ...S.tdMese, ...S.thSticky }}>{mese}</td>
                    {years.map((y) => (
                      <td key={y.id} style={{ ...S.td, ...(y.id === currentYearId ? S.tdCurrent : {}) }}>
                        <input
                          style={S.cell}
                          inputMode="numeric"
                          value={y.months[mi]}
                          placeholder="–"
                          onChange={(ev) => setCell(y.id, mi, ev.target.value)}
                        />
                      </td>
                    ))}
                  </tr>
                ))}
                <tr>
                  <td style={{ ...S.tdAvgLabel, ...S.thSticky }}>Media anno</td>
                  {years.map((y) => {
                    const m = mediaAnno(y);
                    const isCur = y.id === currentYearId;
                    return (
                      <td key={y.id} style={{ ...S.tdAvg, ...(isCur ? S.tdAvgCurrent : {}) }}>
                        {m.avg != null ? fmt0.format(m.avg) : "–"}
                      </td>
                    );
                  })}
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        {/* RENDICONTO CONTI */}
        <section style={S.block}>
          <div style={S.blockHead}>
            <div style={S.blockTitle}><Landmark size={16} color={C.gold} /> Rendiconto conti</div>
            <button style={S.addYearBtn} onClick={addLedgerRow}><Plus size={14} /> Mese</button>
          </div>
          <p style={S.hint}>
            Un rigo per mese. Per Trade Republic inserisci saldo a inizio e fine mese: l'accumulo lo calcolo io.
          </p>

          <div className="cmp" style={S.compareRow}>
            <div style={S.compareCard}>
              <div style={S.compareTop}>Webank</div>
              <div style={S.compareBig}>{webankUltimo != null ? fmt0.format(webankUltimo) : "—"}</div>
              <div style={{ ...S.compareSmall, color: webankStato.color, fontWeight: 600 }}>{webankStato.text}</div>
            </div>
            <div style={S.compareCard}>
              <div style={S.compareTop}>Trade Republic · accumulo tot.</div>
              <div style={{ ...S.compareBig, color: trAccumuloTotale >= 0 ? C.pos : C.neg }}>
                {trAccumuloTotale >= 0 ? "+" : ""}{fmt0.format(trAccumuloTotale)}
              </div>
              <div style={S.compareSmall}>somma degli accumuli mensili</div>
            </div>
            <div style={S.compareCard}>
              <div style={S.compareTop}>Revolut · ultimo mese</div>
              <div style={{ ...S.compareBig, color: revolutUltimo != null && revolutUltimo > REVOLUT_CAP ? C.neg : C.ink }}>
                {revolutUltimo != null ? fmt0.format(revolutUltimo) : "—"}
              </div>
              <div style={S.compareSmall}>tetto {fmt0.format(REVOLUT_CAP)}</div>
            </div>
          </div>

          <div style={S.tableScroll}>
            <table style={S.table}>
              <thead>
                <tr>
                  <th style={{ ...S.th, ...S.thSticky, minWidth: 96 }}>Mese</th>
                  <th style={S.th}>Webank</th>
                  <th style={S.th}>TR iniziale</th>
                  <th style={S.th}>TR finale</th>
                  <th style={S.th}>Accumulo</th>
                  <th style={S.th}>Revolut</th>
                  <th style={{ ...S.th, minWidth: 32 }}></th>
                </tr>
              </thead>
              <tbody>
                {ledgerRows.map((r) => (
                  <tr key={r.id}>
                    <td style={{ ...S.tdMese, ...S.thSticky }}>
                      <input
                        style={S.ledgerLabel}
                        value={r.label}
                        placeholder="es. Agosto 2026"
                        onChange={(ev) => setLedgerField(r.id, "label", ev.target.value)}
                      />
                    </td>
                    <td style={S.td}>
                      <input style={S.cell} inputMode="numeric" placeholder="–" value={r.webank}
                        onChange={(ev) => setLedgerField(r.id, "webank", ev.target.value)} />
                    </td>
                    <td style={S.td}>
                      <input style={S.cell} inputMode="numeric" placeholder="–" value={r.trIn}
                        onChange={(ev) => setLedgerField(r.id, "trIn", ev.target.value)} />
                    </td>
                    <td style={S.td}>
                      <input style={S.cell} inputMode="numeric" placeholder="–" value={r.trOut}
                        onChange={(ev) => setLedgerField(r.id, "trOut", ev.target.value)} />
                    </td>
                    <td style={{ ...S.td, textAlign: "right", paddingRight: 10 }}>
                      <span style={{ fontFamily: mono, fontSize: 13.5, fontWeight: 600, color: r.accumulo == null ? C.inkSoft : r.accumulo >= 0 ? C.pos : C.neg }}>
                        {r.accumulo != null ? (r.accumulo >= 0 ? "+" : "") + fmt0.format(r.accumulo) : "–"}
                      </span>
                    </td>
                    <td style={S.td}>
                      <input style={S.cell} inputMode="numeric" placeholder="–" value={r.revolut}
                        onChange={(ev) => setLedgerField(r.id, "revolut", ev.target.value)} />
                    </td>
                    <td style={{ ...S.td, textAlign: "center" }}>
                      <button style={S.iconBtn} onClick={() => delLedgerRow(r.id)} aria-label="Elimina mese">
                        <Trash2 size={14} />
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </section>

        {/* ANALISI MENSILE */}
        <section style={S.block}>
          <div style={S.blockHead}>
            <div style={S.blockTitle}><PieChart size={16} color={C.gold} /> Analisi mensile</div>
            <button style={S.addYearBtn} onClick={addAnalysis}><Plus size={14} /> Mese</button>
          </div>
          <p style={S.hint}>
            Spesa variabile per categoria (Revolut + Trade Republic). Le fisse su Webank restano nella sezione in alto.
          </p>

          {/* Import CSV */}
          <div style={S.importPanel}>
            <div style={S.importHead}>
              <label style={S.fileBtn}>
                <Upload size={15} /> Importa estratto CSV
                <input type="file" accept=".csv,text/csv" onChange={onFile} style={{ display: "none" }} />
              </label>
              <span style={S.importHint}>TR · Revolut · Webank — anche uno solo</span>
            </div>

            {impMsg && <div style={S.importOk}><Check size={13} strokeWidth={3} /> {impMsg}</div>}

            {imp && imp.needsMapping && (
              <div style={S.mapBox}>
                <div style={S.mapTitle}>Formato non riconosciuto ({imp.fileName}). Indica le colonne:</div>
                <div style={S.mapGrid}>
                  <label style={S.mapLbl}>Descrizione
                    <select style={S.mapSel} value={imp.mapping.descCol} onChange={(e) => setMap("descCol", e.target.value)}>
                      <option value="">—</option>
                      {imp.headers.map((h) => <option key={h} value={h}>{h}</option>)}
                    </select>
                  </label>
                  <label style={S.mapLbl}>Importi
                    <select style={S.mapSel} value={imp.mapping.amtMode} onChange={(e) => setMap("amtMode", e.target.value)}>
                      <option value="single">Colonna unica (con segno)</option>
                      <option value="split">Entrate / Uscite separate</option>
                    </select>
                  </label>
                  {imp.mapping.amtMode === "single" ? (
                    <label style={S.mapLbl}>Colonna importo
                      <select style={S.mapSel} value={imp.mapping.amtCol} onChange={(e) => setMap("amtCol", e.target.value)}>
                        <option value="">—</option>
                        {imp.headers.map((h) => <option key={h} value={h}>{h}</option>)}
                      </select>
                    </label>
                  ) : (
                    <>
                      <label style={S.mapLbl}>Uscite
                        <select style={S.mapSel} value={imp.mapping.outCol} onChange={(e) => setMap("outCol", e.target.value)}>
                          <option value="">—</option>
                          {imp.headers.map((h) => <option key={h} value={h}>{h}</option>)}
                        </select>
                      </label>
                      <label style={S.mapLbl}>Entrate
                        <select style={S.mapSel} value={imp.mapping.inCol} onChange={(e) => setMap("inCol", e.target.value)}>
                          <option value="">—</option>
                          {imp.headers.map((h) => <option key={h} value={h}>{h}</option>)}
                        </select>
                      </label>
                    </>
                  )}
                </div>
                <button style={S.addBtn} onClick={runGeneric}>Analizza</button>
              </div>
            )}

            {imp && imp.preview && (
              <div style={S.previewBox}>
                <div style={S.previewTop}>
                  <span style={S.previewSrc}>{SOURCE_LABEL[imp.source]}</span>
                  <span style={S.previewMeta}>{imp.preview.count} movimenti · {imp.preview.excluded} interni esclusi</span>
                </div>
                <div style={S.previewList}>
                  {Object.entries(imp.preview.totals).sort((a, b) => b[1] - a[1]).map(([cat, val]) => (
                    <div key={cat} style={S.previewRow}>
                      <span style={{ ...S.dotCat, background: catColor(cat) }} />
                      <span style={S.previewCat}>{cat}</span>
                      <span style={S.previewVal}>{fmt2.format(val)}</span>
                    </div>
                  ))}
                </div>
                {imp.preview.altro.length > 0 && (
                  <div style={S.previewAltro}>{imp.preview.altro.length} movimenti finiti in "Altro" — potrai riclassificarli a mano dopo.</div>
                )}
                <div style={S.targetRow}>
                  <select style={S.mapSel} value={impTarget} onChange={(e) => setImpTarget(e.target.value)}>
                    {analyses.map((a) => <option key={a.id} value={a.id}>Aggiungi a: {a.label || "(senza nome)"}</option>)}
                    <option value="new">➕ Nuovo mese…</option>
                  </select>
                  {impTarget === "new" && (
                    <input style={S.targetInput} value={impLabel} placeholder="es. Agosto 2026" onChange={(e) => setImpLabel(e.target.value)} />
                  )}
                </div>
                <div style={S.confirmRow}>
                  <button style={S.confirmBtn} onClick={confirmImport}><Check size={15} /> Aggiungi al mese</button>
                  <button style={S.cancelBtn} onClick={() => setImp(null)}>Annulla</button>
                </div>
              </div>
            )}
          </div>

          {/* Trend: totale spesa per mese */}
          {trend.length > 1 && (
            <div style={S.trendWrap}>
              {trend.map((t) => (
                <button key={t.id} style={S.trendCol} onClick={() => setSelAnalysis(t.id)}>
                  <div style={S.trendBarTrack}>
                    <div style={{ ...S.trendBar, height: `${Math.max(4, (t.total / trendMax) * 100)}%`, background: t.id === selAnalysis ? C.gold : "#D7DBE3" }} />
                  </div>
                  <div style={{ ...S.trendLabel, color: t.id === selAnalysis ? C.ink : C.inkSoft }}>
                    {(t.label || "—").split(" ")[0].slice(0, 3)}
                  </div>
                </button>
              ))}
            </div>
          )}

          {/* Tab mesi */}
          <div style={S.tabRow}>
            {analyses.map((a) => (
              <button
                key={a.id}
                onClick={() => setSelAnalysis(a.id)}
                style={{ ...S.tab, ...(a.id === selAnalysis ? S.tabOn : {}) }}
              >
                {a.label || "Senza nome"}
              </button>
            ))}
          </div>

          {current && (
            <div>
              <div style={S.analysisHead}>
                <input
                  style={S.analysisLabel}
                  value={current.label}
                  placeholder="es. Agosto 2026"
                  onChange={(ev) => setAnalysisLabel(current.id, ev.target.value)}
                />
                <div style={S.analysisTotalBox}>
                  <span style={S.analysisTotalLbl}>totale</span>
                  <span style={S.analysisTotal}>{fmt2.format(curTotal)}</span>
                </div>
                <button style={S.iconBtn} onClick={() => delAnalysis(current.id)} aria-label="Elimina mese">
                  <Trash2 size={15} />
                </button>
              </div>

              {/* Righe categoria con barra % */}
              <div style={{ marginTop: 6 }}>
                {curRows.map((r) => {
                  const pct = curTotal > 0 ? (r.val / curTotal) * 100 : 0;
                  return (
                    <div key={r.id} style={S.catRow}>
                      <div style={S.catTop}>
                        <select
                          style={S.catSelect}
                          value={CATEGORIE.includes(r.cat) ? r.cat : "Altro"}
                          onChange={(ev) => setRow(current.id, r.id, "cat", ev.target.value)}
                        >
                          {CATEGORIE.map((c) => <option key={c} value={c}>{c}</option>)}
                        </select>
                        <div style={S.catAmtWrap}>
                          <input
                            style={S.catAmt}
                            inputMode="decimal"
                            value={r.amount}
                            placeholder="0"
                            onChange={(ev) => setRow(current.id, r.id, "amount", ev.target.value)}
                          />
                          <span style={S.eur}>€</span>
                          <span style={S.catPct}>{pct.toFixed(0)}%</span>
                          <button style={S.iconBtnSm} onClick={() => delRow(current.id, r.id)} aria-label="Elimina categoria">
                            <Trash2 size={13} />
                          </button>
                        </div>
                      </div>
                      <div style={S.barTrack}>
                        <div style={{ ...S.bar, width: `${pct}%`, background: catColor(r.cat) }} />
                      </div>
                    </div>
                  );
                })}
              </div>

              <button style={S.addBtn} onClick={() => addRow(current.id)}><Plus size={15} /> Aggiungi categoria</button>
            </div>
          )}
        </section>

        <footer style={S.footer}>I dati restano salvati su questo dispositivo. Aggiungi la pagina alla schermata Home per aprirla come un'app.</footer>
      </div>
    </div>
  );
}

// ---- Barra backup (Esporta / Importa su iCloud Drive) ----
function BackupBar() {
  const [msg, setMsg] = useState("");
  const fileRef = React.useRef(null);
  const flash = (t) => { setMsg(t); setTimeout(() => setMsg(""), 2600); };

  const doExport = () => {
    const data = localStorage.getItem(STORAGE_KEY) || "{}";
    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const d = new Date().toISOString().slice(0, 10);
    a.href = url; a.download = "budget-backup-" + d + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    flash("Backup creato \u2192 salvalo in iCloud Drive");
  };
  const doImport = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        JSON.parse(String(r.result));
        localStorage.setItem(STORAGE_KEY, String(r.result));
        flash("Backup importato \u2013 ricarico\u2026");
        setTimeout(() => location.reload(), 700);
      } catch (err) { flash("File non valido"); }
    };
    r.readAsText(f);
    e.target.value = "";
  };

  const S = {
    bar: { position: "sticky", top: 0, zIndex: 50, display: "flex", alignItems: "center", gap: 8,
      padding: "10px 16px", background: "rgba(244,245,247,0.92)", backdropFilter: "blur(8px)",
      borderBottom: "1px solid #E4E7ED", flexWrap: "wrap" },
    btn: { display: "inline-flex", alignItems: "center", gap: 6, padding: "7px 13px", fontSize: 13,
      fontWeight: 600, color: "#17233B", background: "#fff", border: "1px solid #E4E7ED",
      borderRadius: 9, cursor: "pointer" },
    btnGold: { display: "inline-flex", alignItems: "center", gap: 6, padding: "7px 13px", fontSize: 13,
      fontWeight: 600, color: "#fff", background: "#B67B1E", border: "none", borderRadius: 9, cursor: "pointer" },
    msg: { fontSize: 12, color: "#1F7A54", fontWeight: 600 },
    spacer: { flex: 1 },
  };
  return React.createElement("div", { style: S.bar },
    React.createElement("button", { style: S.btnGold, onClick: doExport },
      React.createElement(Upload, { size: 14 }), "Esporta backup"),
    React.createElement("button", { style: S.btn, onClick: () => fileRef.current && fileRef.current.click() },
      "Importa backup"),
    React.createElement("input", { ref: fileRef, type: "file", accept: ".json,application/json",
      onChange: doImport, style: { display: "none" } }),
    React.createElement("span", { style: S.spacer }),
    msg ? React.createElement("span", { style: S.msg }, msg) : null
  );
}

function Root() {
  return React.createElement(React.Fragment, null,
    React.createElement(BackupBar, null),
    React.createElement(App, null)
  );
}
